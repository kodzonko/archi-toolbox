[project]
name = "archi-toolbox"
version = "0.1.0"
description = "Set of tools useful for architects and interior designers"
requires-python = "~=3.14.0"
dependencies = ["loguru==0.7.3", "svglib==1.6.0"]

[dependency-groups]
dev = [
    "mockito>=1.4.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "ty>=0.0.38"
]

[build-system]
requires = ["uv_build~=0.9.28"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py314"
src = ["src", "tests"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]
force-exclude = true

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "EM",   # flake8-errmsg
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "ISC",  # flake8-implicit-str-concat
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # Ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "COM812", # Avoid conflicts with the Ruff formatter.
    "D203",   # Prefer no blank line before class docstrings.
    "D213",   # Prefer summary on the first docstring line.
    "ISC001", # Avoid conflicts with the Ruff formatter.
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",     # Tests should optimize for clear scenarios, not annotation ceremony.
    "D",       # Test names describe behavior; docstrings are optional.
    "PLR2004", # Literal values are often the point of a test.
    "S101",    # Assertions are expected in tests.
]

[tool.ruff.lint.isort]
known-first-party = ["archi_toolbox"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
root = ["./src"]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
respect-ignore-files = true

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
output-format = "concise"
